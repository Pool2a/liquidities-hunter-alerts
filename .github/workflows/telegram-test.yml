
name: Liquidities Hunter Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram configuration
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERREUR : token absent ou secret inaccessible"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERREUR : Chat ID absent"
            exit 1
          fi

          echo "Token présent : oui"
          echo "Longueur du token : ${#TOKEN}"
          echo "Chat ID présent : oui"
          echo "Configuration chargée correctement"
