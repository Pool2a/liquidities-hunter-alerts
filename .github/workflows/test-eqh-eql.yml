
name: Test Liquidities Hunter EQH EQL

on:
  workflow_dispatch:
  push:
    paths:
      - 'test_eqh_eql.py'
      - '.github/workflows/test-eqh-eql.yml'

jobs:
  test-eqh-eql:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tester le moteur EQH EQL
        run: python test_eqh_eql.py
